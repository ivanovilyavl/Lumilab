services:
  db:
    image: postgres:15-alpine
    env_file: .env.prod
    environment:
      POSTGRES_DB: zapisbot
      POSTGRES_USER: zapisbot
    volumes: ['pg_prod_data:/var/lib/postgresql/data']
    restart: always

  redis:
    image: redis:7-alpine
    restart: always

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    env_file: .env.prod
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    depends_on: [db, redis]
    restart: always

  bot:
    build:
      context: .
      dockerfile: docker/Dockerfile.bot
    env_file: .env.prod
    command: python -m bot.main
    depends_on: [db, redis, api]
    restart: always

  analytics_bot:
    build:
      context: .
      dockerfile: docker/Dockerfile.bot
    env_file: .env.prod
    command: python -m analytics_bot.main
    depends_on: [db, redis]
    restart: always

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    env_file: .env.prod
    command: celery -A worker.celery_app worker --loglevel=info
    depends_on: [db, redis]
    restart: always

  beat:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    env_file: .env.prod
    command: celery -A worker.celery_app beat --loglevel=info
    depends_on: [db, redis]
    restart: always

  nginx:
    build:
      context: .
      dockerfile: docker/Dockerfile.nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on: [api]
    restart: always

volumes:
  pg_prod_data:
