version: '3.9'
services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: zapisbot_dev
      POSTGRES_USER: zapisbot
      POSTGRES_PASSWORD: devpassword
    ports: ['5432:5432']
    volumes: ['pg_dev_data:/var/lib/postgresql/data']

  redis:
    image: redis:7-alpine
    ports: ['6379:6379']

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    env_file: .env.dev
    ports: ['8000:8000']
    volumes: ['./:/app']
    command: uvicorn api.main:app --reload --host 0.0.0.0 --port 8000
    depends_on: [db, redis]

  bot:
    build:
      context: .
      dockerfile: docker/Dockerfile.bot
    env_file: .env.dev
    volumes: ['./:/app']
    command: python -m bot.main
    depends_on: [db, redis, api]

  analytics_bot:
    build:
      context: .
      dockerfile: docker/Dockerfile.bot
    env_file: .env.dev
    volumes: ['./:/app']
    command: python -m analytics_bot.main
    depends_on: [db, redis]

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    env_file: .env.dev
    volumes: ['./:/app']
    command: celery -A worker.celery_app worker --loglevel=info
    depends_on: [db, redis]

  beat:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    env_file: .env.dev
    volumes: ['./:/app']
    command: celery -A worker.celery_app beat --loglevel=info
    depends_on: [db, redis]

volumes:
  pg_dev_data:
