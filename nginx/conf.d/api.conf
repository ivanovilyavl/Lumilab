# HTTP → HTTPS redirect
server {
    listen 80;
    server_name bot.lumilab.space;

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl;
    server_name bot.lumilab.space;

    ssl_certificate /etc/letsencrypt/live/bot.lumilab.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bot.lumilab.space/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # API — проксируем на FastAPI (без trailing slash, чтобы сохранить /api/ prefix)
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Webhook для Telegram
    location /webhook {
        proxy_pass http://api:8000/webhook;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Tribute webhook
    location /tribute/ {
        proxy_pass http://api:8000/tribute/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Admin Mini App — статика (должен быть ВЫШЕ location /)
    location /admin/ {
        root /var/www;
        try_files $uri $uri/ /admin/index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    location ~* ^/admin/.*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        root /var/www;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Mini App — статика
    location / {
        root /var/www/miniapp;
        index index.html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        root /var/www/miniapp;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
