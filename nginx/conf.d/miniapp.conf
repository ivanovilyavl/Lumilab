server {
    listen 80;
    server_name app.zapisbot.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name app.zapisbot.ru;

    ssl_certificate /etc/letsencrypt/live/app.zapisbot.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.zapisbot.ru/privkey.pem;

    root /var/www/miniapp;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
